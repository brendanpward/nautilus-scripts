# gpg.conf
#

DEBUG="N" ; [ "$DEBUG" = "Y" ] && set -x # enable / disable debug (can be found at ~/.xsession-errors)

FIELD_SEPARATOR=$'\r'          # The main field separator.
GUI_BOX_HEIGHT=550             # Height of the GUI dialog boxes.
GUI_BOX_WIDTH=900              # Width of the GUI dialog boxes.

ZENITY="$(which zenity)"
ZENITY_OPTS=""
ZENITY_VERSION_MAJOR="$(zenity --version | cut -d '.' -f 1)"
if [ "$ZENITY_VERSION_MAJOR" -ge 4 ]; then ZENITY_ICON_OPTION="--icon"; else ZENITY_ICON_OPTION="--window-icon"; fi

ZENITY_NAME="GPG : $(basename "$0")"
ZENITY_WINDOW_ICON="$HOME/.local/share/nautilus/scripts/gpg/GnuPG.png"

GPG_SIGN=true                # Sign encrypted files or not
GPG_EXPIRED=false            # List expired keys
GPG_INDIVIDUAL_FILES=false   # Encrypt each file individually (folders excepted)

OUTPUT="/tmp/$(basename "$0").$$"

_pynotify() {

env "ARGV=$1" $(which python) << EOT
import os
import pygtk
import pynotify
import sys
argv = os.environ['ARGV']
if __name__ == '__main__':
  if not pynotify.init("Basics"):
    sys.exit(1)
  n = pynotify.Notification("GPG", argv)
  if not n.show():
    sys.exit(1)
EOT

}

_zenity_question() {

$ZENITY $ZENITY_OPTS --question $ZENITY_ICON_OPTION "$ZENITY_WINDOW_ICON" \
--text "$@"

}

_zenity_entry_text() {

$ZENITY $ZENITY_OPTS --title "$ZENITY_NAME" $ZENITY_ICON_OPTION "$ZENITY_WINDOW_ICON" --width "600" \
  --entry --text "$@"

}

_zenity_error_text() {

$ZENITY $ZENITY_OPTS --title "$ZENITY_NAME" $ZENITY_ICON_OPTION "$ZENITY_WINDOW_ICON" \
  --error --text "$@"

}

_zenity_info() {

RETVAL="$1"
OK_NO_OUTPUT="$2"
KO_NO_OUTPUT="$3"

if [ -s "$OUTPUT" ]; then
  $ZENITY $ZENITY_OPTS --title "$ZENITY_NAME" $ZENITY_ICON_OPTION "$ZENITY_WINDOW_ICON" --width "600" --height "400" \
  --text-info --filename "$OUTPUT" --font "monospace 12"
else
  if [ "$RETVAL" -eq 0 ]; then
    $ZENITY $ZENITY_OPTS --title "$ZENITY_NAME" $ZENITY_ICON_OPTION "$ZENITY_WINDOW_ICON" \
    --info --text "$OK_NO_OUTPUT"
  else
    $ZENITY $ZENITY_OPTS --title "$ZENITY_NAME" $ZENITY_ICON_OPTION "$ZENITY_WINDOW_ICON" \
    --error --text "$KO_NO_OUTPUT"
  fi
fi

rm -f "$OUTPUT"

}

if [ ! -x "$ZENITY" ]; then
  _pynotify "Zenity was NOT found"
  exit 1
fi

_encrypt_files() {
  armour=$1
  recipients=$2
  local -n fileArray=$3
  fileCount=${#fileArray[@]}

  if [[ $armour = "true" ]]; then
    armourFlag="--armor "
    fileExtension=".asc"
  else
    armourFlag=""
    fileExtension=".gpg"
  fi

  _zenity_question "Do you also want to sign the selected file(s)?"

  if [[ $? -eq 0 ]]; then
    signFlag="--sign "
  else
    signFlag=""
  fi

  error=0
  if [[ "$GPG_INDIVIDUAL_FILES" = "true" ]]; then
    # Encrypt each selected file individually
    for file in "${fileArray[@]}"; do
      # Check to see if $file is a file
      if [[ -f "$file" ]]; then
        gpg --output "$file$fileExtension" --encrypt $armourFlag$signFlag$recipients "$file" 1>> "$OUTPUT" 2>> "$OUTPUT"
      # Check to see if $file is a directory
      elif [[ -d "$file" ]]; then
        tar -cf - "$file" | gpg --output "$file.tar$fileExtension" --encrypt $armourFlag$signFlag$recipients 1>> "$OUTPUT" 2>> "$OUTPUT"
      fi
      error=$(($error + $?))
    done
  else
    # When multiple files are selected, tar them and encrypt them as one file
    # In the case of a single file being selected, do not tar it unless it is a directory
    if [[ "$fileCount" -eq 1 ]]; then
      # Working with only a single file
      # Check to see if $file is a file
      if [[ -f "$fileArray" ]]; then
        gpg --output "$fileArray$fileExtension" --encrypt $armourFlag$signFlag$recipients "$fileArray" 1>> "$OUTPUT" 2>> "$OUTPUT"
      # Check to see if $file is a directory
      elif [[ -d "$fileArray" ]]; then
        tar -cf - "$fileArray" | gpg --output "$fileArray$fileExtension" --encrypt $armourFlag$signFlag$recipients 1>> "$OUTPUT" 2>> "$OUTPUT"
      fi
    else
      # Working with multiple files
      # Prompt the user for the file name to be created
      FILENAME=$(zenity --entry --title "File Name"  --text "Please enter a name for the encrypted tar file that you want to create (without extension):")
      tar -cf - "${fileArray[@]}" | gpg --output "$FILENAME.tar$fileExtension" --encrypt $armourFlag$signFlag$recipients 1>> "$OUTPUT" 2>> "$OUTPUT"
    fi
    error=$?
  fi
  _zenity_info "$error" "Successfully encrypted" "Unknown error (more information can be found at ~/.xsession-errors)"
}

_select_public_keys() {
   # This function gets all of the public GPG keys on the system and prints
   # them in zenity window that is presented to the user.  The user can then
   # check off which keys they would like to use.  The selected keys are then
   # returned.

   local keylines=""
   local creation=""
   local expiry=""
   local email=""
   local keyid=""
   keylines=$(gpg --list-public-keys --with-colons 2>/dev/null | grep -A 2 "pub:")
   local zenity_user_list=()
   if [ -z "$keylines" ]; then
     # No keys on the system
     return -1
   else
     expired_key_found=false
     while IFS= read -r line; do
       if [[ "$line" =~ ^pub: ]]; then
         creation=$(cut -d ":" -f 6 <<<"$line")
         creation=$(date -d @" $creation " +%Y-%m-%d)
         expiry=$(cut -d ":" -f 7 <<<"$line")
         if [[ $expiry == "" ]]; then
           expiry="No expiry"
         else
	   if [[ "$GPG_EXPIRED" = "false" ]] && [ "$expiry" -lt $(date +%s) ]; then
	     expired_key_found=true
	   fi
           expiry=$(date -d @" $expiry " +%Y-%m-%d)
         fi  
       elif [[ "$line" =~ ^fpr: ]]; then
         keyid=$(cut -d ":" -f 10 <<<"$line")
       elif [[ "$line" =~ ^uid: ]]; then
         email=$(cut -d ":" -f 10 <<<"$line")
       elif [[ "$line" =~ -- ]]; then
         if [[ "$expired_key_found" = "false" ]]; then
           zenity_user_list+=(FALSE "$email" "$creation" "$expiry" "$keyid")
	 else
	   # Reset the check for expired key and skip adding it to the list
	   expired_key_found=false
	 fi
       fi  
     done <<< "$keylines"
     if [[ "$expired_key_found" = "false" ]]; then
       zenity_user_list+=(FALSE "$email" "$creation" "$expiry" "$keyid")
     fi
   fi
   
   local TEMP_DATA_TASK=$(zenity \
    --list \
    --checklist \
    --title="Select users" \
    --text="Select one or more users from the list below." \
    --column="Select" \
    --column="E-mail" \
    --column="Creation Date" \
    --column="Expiration Date" \
    --column="Key ID" "${zenity_user_list[@]}" \
    --width="$GUI_BOX_WIDTH" \
    --print-column=5 \
    --height="$GUI_BOX_HEIGHT" \
    --separator="\n" 2>/dev/null)

   printf "%s" "$TEMP_DATA_TASK"
}
