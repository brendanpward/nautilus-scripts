# gpg.conf
#

DEBUG="N" ; [ "$DEBUG" = "Y" ] && set -x # enable / disable debug (can be found at ~/.xsession-errors)

FIELD_SEPARATOR=$'\r'          # The main field separator.
GUI_BOX_HEIGHT=550             # Height of the GUI dialog boxes.
GUI_BOX_WIDTH=900              # Width of the GUI dialog boxes.

ZENITY="$(which zenity)"
ZENITY_OPTS=""
ZENITY_VERSION_MAJOR="$(zenity --version | cut -d '.' -f 1)"
if [ "$ZENITY_VERSION_MAJOR" -ge 4 ]; then ZENITY_ICON_OPTION="--icon"; else ZENITY_ICON_OPTION="--window-icon"; fi

ZENITY_NAME="GPG : $(basename "$0")"
ZENITY_WINDOW_ICON="$HOME/.local/share/nautilus/scripts/gpg/GnuPG.png"

GPG_SIGN=true
GPG_EXPIRED=false         # List expired keys

OUTPUT="/tmp/$(basename "$0").$$"

_pynotify() {

env "ARGV=$1" $(which python) << EOT
import os
import pygtk
import pynotify
import sys
argv = os.environ['ARGV']
if __name__ == '__main__':
  if not pynotify.init("Basics"):
    sys.exit(1)
  n = pynotify.Notification("GPG", argv)
  if not n.show():
    sys.exit(1)
EOT

}

_zenity_entry_text() {

$ZENITY $ZENITY_OPTS --title "$ZENITY_NAME" $ZENITY_ICON_OPTION "$ZENITY_WINDOW_ICON" --width "600" \
  --entry --text "$@"

}

_zenity_error_text() {

$ZENITY $ZENITY_OPTS --title "$ZENITY_NAME" $ZENITY_ICON_OPTION "$ZENITY_WINDOW_ICON" \
  --error --text "$@"

}

_zenity_info() {

RETVAL="$1"
OK_NO_OUTPUT="$2"
KO_NO_OUTPUT="$3"

if [ -s "$OUTPUT" ]; then
  $ZENITY $ZENITY_OPTS --title "$ZENITY_NAME" $ZENITY_ICON_OPTION "$ZENITY_WINDOW_ICON" --width "600" --height "400" \
  --text-info --filename "$OUTPUT" --font "monospace 12"
else
  if [ "$RETVAL" -eq 0 ]; then
    $ZENITY $ZENITY_OPTS --title "$ZENITY_NAME" $ZENITY_ICON_OPTION "$ZENITY_WINDOW_ICON" \
    --info --text "$OK_NO_OUTPUT"
  else
    $ZENITY $ZENITY_OPTS --title "$ZENITY_NAME" $ZENITY_ICON_OPTION "$ZENITY_WINDOW_ICON" \
    --error --text "$KO_NO_OUTPUT"
  fi
fi

rm -f "$OUTPUT"

}

if [ ! -x "$ZENITY" ]; then
  _pynotify "Zenity was NOT found"
  exit 1
fi

_str_remove_empty_tokens() {
    # This function removes empty tokens from a string, ensuring it is compact
    # and well-formed.
    #
    # Parameters:
    #   - $1 (input_str): The input string containing tokens separated by
    #     $FIELD_SEPARATOR.

    local input_str=$1
    input_str=$(tr -s "$FIELD_SEPARATOR" <<<"$input_str")
    input_str=$(sed "s|$FIELD_SEPARATOR$||" <<<"$input_str")

    printf "%s" "$input_str"
}

_convert_text_to_delimited_string() {
    # This function converts newline-separated text into a delimited string of
    # items.
    #
    # Parameters:
    #   - $1 (input_items): A string containing items separated by newlines.
    #
    # Returns:
    #   - A string containing the items separated by the 'FIELD_SEPARATOR'
    #   variable.

    local input_items=$1
    local new_line="'\$'\\\n''"

    input_items=$(tr "\n" "$FIELD_SEPARATOR" <<<"$input_items")
    input_items=$(sed -z "s|$new_line|\n|g" <<<"$input_items")
    input_items=$(_str_remove_empty_tokens "$input_items")

    printf "%s" "$input_items"
}

_get_items_count() {
    # This function counts the number of items in a string, where items are
    # separated by a specific field separator. It assumes that the input string
    # contains a list of items separated by the value of the variable
    # $FIELD_SEPARATOR.
    #
    # Parameters:
    # - $1 (input_files): A string containing a list of items separated by
    #   the defined $FIELD_SEPARATOR.

    local input_files=$1
    local files_count=0

    if [[ -n "$input_files" ]]; then
        files_count=$(tr -cd "$FIELD_SEPARATOR" <<<"$input_files" | wc -c)
        ((files_count++))
    fi

    printf "%s" "$files_count"
}

_select_public_keys() {
   # This function gets all of the public GPG keys on the system and prints
   # them in zenity window that is presented to the user.  The user can then
   # check off which keys they would like to use.  The selected keys are then
   # returned.

   local keylines=""
   local creation=""
   local expiry=""
   local email=""
   local keyid=""
   keylines=$(gpg --list-public-keys --with-colons 2>/dev/null | grep -A 2 "pub:")
   local zenity_user_list=()
   while IFS= read -r line; do
   if [[ "$line" =~ ^pub: ]]; then
      creation=$(cut -d ":" -f 6 <<<"$line")
      creation=$(date -d @" $creation " +%Y-%m-%d)
      expiry=$(cut -d ":" -f 7 <<<"$line")
      if [[ $expiry == "" ]]; then
         expiry="No expiry"
      else
         expiry=$(date -d @" $expiry " +%Y-%m-%d)
      fi  
   elif [[ "$line" =~ ^fpr: ]]; then
      keyid=$(cut -d ":" -f 10 <<<"$line")
   elif [[ "$line" =~ ^uid: ]]; then
      email=$(cut -d ":" -f 10 <<<"$line")
   elif [[ "$line" =~ -- ]]; then
      zenity_user_list+=(FALSE "$email" "$creation" "$expiry" "$keyid")
   fi  
done <<< "$keylines"
   
   local TEMP_DATA_TASK=$(zenity \
    --list \
    --checklist \
    --title="Select users" \
    --text="Select one or more users from the list below." \
    --column="Select" \
    --column="E-mail" \
    --column="Creation Date" \
    --column="Expiration Date" \
    --column="Key ID" "${zenity_user_list[@]}" \
    --width="$GUI_BOX_WIDTH" \
    --print-column=5 \
    --height="$GUI_BOX_HEIGHT" \
    --separator="\n" 2>/dev/null)

   printf "%s" "$TEMP_DATA_TASK"
}
